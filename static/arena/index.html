<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ARK · Arena — metered research console</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'&gt;&lt;text y='14' font-size='14'&gt;⚡&lt;/text&gt;&lt;/svg&gt;">
<style>
:root{
  --bg:#000; --bg2:#070707; --panel:#0c0c0c; --panel2:#161106;
  --border:#2a2a2a; --border2:#463818;
  --text:#d8d2c4; --muted:#8a8170; --faint:#5d5647;
  --accent:#ff8a00; --accent2:#ffb000;
  --good:#33d17a; --warn:#ffb000; --bad:#ff453a;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--mono);background:radial-gradient(1200px 600px at 80% -10%,#15203a 0%,var(--bg) 55%);
  color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:232px 1fr;height:100vh}
/* narrow screens: the sidebar becomes a scrolling strip, never disappears */
@media(max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh}
  #sidebar{flex-direction:row;align-items:center;gap:8px;padding:10px 12px;
    border-right:none;border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden}
  .brand{padding:0 10px 0 2px;flex:none}
  .brand-sub{display:none}
  #nav{flex-direction:row;gap:6px;overflow:visible;flex:none}
  .nav-item{white-space:nowrap;flex:none;padding:7px 10px}
  .nav-count{margin-left:6px}
  .side-foot{display:none}
  #topbar{padding:11px 14px}
  #search{width:150px}
  #view{padding:16px 14px 60px}
}

/* sidebar */
#sidebar{background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 12px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:9px;color:#06231f}
.brand-name{font-weight:700;letter-spacing:.14em;font-size:15px}
.brand-sub{color:var(--faint);font-size:11px;letter-spacing:.08em}
#nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;
  color:var(--muted);cursor:pointer;user-select:none;font-size:13px;transition:background .15s,color .15s}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:var(--panel2);color:var(--text)}
.nav-item.locked{color:var(--faint)}
.nav-ico{width:18px;text-align:center}
.nav-count{margin-left:auto;font-size:11px;color:var(--faint)}
.nav-div{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  padding:12px 11px 5px;border-top:1px solid var(--border);margin-top:8px}
@media(max-width:860px){.nav-div{display:none}}
.side-foot{padding-top:12px;border-top:1px solid var(--border)}
.health{font-size:11px;color:var(--muted);white-space:pre-line}
.health b{color:var(--accent);font-weight:600}

/* main */
#main{display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 22px;border-bottom:1px solid var(--border);background:rgba(10,14,22,.7);
  position:sticky;top:0;z-index:5;flex-wrap:wrap}
#view-title{font-size:17px;font-weight:650}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#search{width:210px;padding:7px 11px;background:var(--panel);color:var(--text);
  border:1px solid var(--border);border-radius:9px;font:12.5px var(--mono);outline:none}
#search:focus{border-color:var(--accent2)}
.pill{font-size:11px;color:var(--muted);padding:4px 9px;border:1px solid var(--border);
  border-radius:999px;background:var(--panel);white-space:nowrap}
.pill.live{color:var(--good);border-color:rgba(51,209,122,.35)}
#view{padding:20px 22px 70px;overflow:auto}

/* generic */
.section-head{display:flex;align-items:baseline;gap:10px;margin:24px 0 11px}
.section-head:first-child{margin-top:2px}
.section-head h2{font-size:13px;font-weight:650;margin:0;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted)}
.section-head .cn{color:var(--faint);font-size:11.5px}
p{margin:0 0 11px;max-width:78ch;color:var(--text)}
p.mut{color:var(--muted);font-size:12.5px}
a{color:var(--accent2)}
.hero{background:linear-gradient(135deg,rgba(255,138,0,.07),rgba(255,176,0,.03));
  border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:18px}
.hero h1{margin:0 0 6px;font-size:18px}
.hero p{margin:0;color:var(--muted);font-size:13px;max-width:78ch}
.stat-row{display:flex;gap:11px;flex-wrap:wrap;margin-top:15px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:11px 15px;min-width:104px}
.stat .n{font-size:20px;color:var(--accent);font-weight:600}
.stat .l{color:var(--muted);font-size:11px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--border);
  border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--border2)}
.card.featured{border-color:rgba(255,138,0,.35)}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card-title{font-weight:650;font-size:13.5px}
.card-key{font-size:11px;color:var(--faint)}
.card-doc{color:var(--muted);font-size:12px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}
.badge{font-size:10.5px;padding:2px 7px;border-radius:6px;white-space:nowrap;
  border:1px solid var(--border2);color:var(--muted);background:var(--panel2)}
.badge.layer{color:var(--accent2)}
.badge.warn{color:var(--warn);background:rgba(255,176,0,.07)}
.badge.muted{color:var(--faint)}
.badge.good{color:var(--good);border-color:rgba(51,209,122,.35)}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--border2);
  border-radius:9px;padding:7px 13px;font:13px var(--mono);cursor:pointer;transition:all .15s}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1200;
  border:none;font-weight:650}
.btn:disabled{opacity:.42;cursor:default}
.btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
table.rt{width:100%;border-collapse:collapse;font-size:11.5px}
table.rt th{text-align:left;color:var(--muted);padding:5px 8px;border-bottom:1px solid var(--border2);
  position:sticky;top:0;background:var(--panel);font-weight:600}
table.rt td{padding:5px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.rt td.num{color:var(--accent);text-align:right}
.tablewrap{overflow:auto;max-height:300px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel)}
.chartbox{background:var(--bg);border:1px solid var(--border);border-radius:11px;
  padding:11px 12px 5px;margin:10px 0 14px}
.chart-title{font-size:11.5px;color:var(--accent);margin-bottom:5px}
svg{display:block;max-width:100%;height:auto}
.warnbox{background:rgba(255,176,0,.07);border:1px solid rgba(255,176,0,.3);color:var(--warn);
  border-radius:9px;padding:9px 12px;margin:10px 0;font-size:12px;white-space:pre-wrap}
.lockbox{border:1px dashed var(--border2);border-radius:14px;padding:26px 22px;text-align:center;
  color:var(--muted);background:var(--panel)}
.lockbox .big{font-size:26px;margin-bottom:8px}
.kvs{display:grid;grid-template-columns:minmax(120px,240px) 1fr;gap:2px 16px;font-size:12px}
.kvs .k{color:var(--muted);padding:4px 0;border-bottom:1px solid var(--border)}
.kvs .v{padding:4px 0;border-bottom:1px solid var(--border);word-break:break-word}
.kvs .v.num{color:var(--accent)}
.cells{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.cell{width:13px;height:13px;border-radius:2.5px;background:var(--accent)}
.cell.book{opacity:.7}.cell.strategy{opacity:.46}.cell.watchlist{opacity:.3}.cell.market{opacity:.95}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:20px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 2px;font-size:12.5px;color:var(--muted)}
.ctl input[type=range]{flex:1 1 220px;min-width:170px;accent-color:var(--accent)}
.ctl output{color:var(--accent);font-weight:650;min-width:4em}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">⚡</div>
      <div class="brand-text">
        <div class="brand-name">ARK</div>
        <div class="brand-sub">arena · metered</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot"><div id="health" class="health"></div></div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div id="view-title">Dashboard</div>
      <div class="top-right">
        <input id="search" type="search" placeholder="Search skills…" autocomplete="off">
        <span class="pill" id="pill-mode">public deployment</span>
        <span class="pill live" id="pill-health">● ledger online</span>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>

function drawChart(){
  const d=DATA.ohlcv[CH_TK],svg=document.getElementById("figc");
  if(!d||!svg)return;
  clear(svg);
  const n=d.c.length,L=54,R=16,T=14,W=760,H=340,w=W-L-R;
  const HP=210,HV=54,GAP=22,TV=T+HP+GAP;
  const hi=Math.max(...d.h),lo=Math.min(...d.l),pad=(hi-lo)*.06||1;
  const Y=v=>T+HP-((v-(lo-pad))/((hi+pad)-(lo-pad)))*HP;
  const X=i=>L+(n===1?w/2:(i/(n-1))*w);
  const bw=Math.max(1.2,Math.min(7,w/n*.62));
  for(let i=0;i<=4;i++){const v=(lo-pad)+(i/4)*((hi+pad)-(lo-pad));
    el("line",{x1:L,y1:Y(v),x2:L+w,y2:Y(v),stroke:cssv("--border"),"stroke-width":.5},svg);
    stext(svg,L-7,Y(v)+4,v.toFixed(v>100?0:2),{anchor:"end",size:10});}
  for(let i=0;i<n;i++){
    const up=d.c[i]>=d.o[i],col=up?cssv("--good"):cssv("--bad");
    el("line",{x1:X(i),y1:Y(d.h[i]),x2:X(i),y2:Y(d.l[i]),stroke:col,"stroke-width":.9,opacity:.85},svg);
    const y0=Y(Math.max(d.o[i],d.c[i])),y1=Y(Math.min(d.o[i],d.c[i]));
    el("rect",{x:X(i)-bw/2,y:y0,width:bw,height:Math.max(y1-y0,.9),fill:col,opacity:.9},svg);
  }
  const vmax=Math.max(...d.v);
  for(let i=0;i<n;i++){
    const hgt=(d.v[i]/vmax)*HV;
    el("rect",{x:X(i)-bw/2,y:TV+HV-hgt,width:bw,height:Math.max(hgt,.6),
      fill:d.c[i]>=d.o[i]?cssv("--good"):cssv("--bad"),opacity:.42},svg);
  }
  stext(svg,L-7,TV+HV+4,"vol",{anchor:"end",size:10});
  const step=Math.max(1,Math.floor(n/6));
  for(let i=0;i<n;i+=step)stext(svg,X(i),H-8,d.d[i].slice(5),{anchor:"middle",size:10});
  document.getElementById("chtitle").textContent=
    CH_TK+"  ·  "+d.d[0]+" → "+d.d[n-1]+"  ·  "+n+" daily bars (cached snapshot)";
  const chg=(d.c[n-1]/d.c[0]-1)*100;
  document.getElementById("chstats").innerHTML=
     '<div class="stat"><div class="n">'+d.c[n-1].toFixed(2)+'</div><div class="l">last close</div></div>'
    +'<div class="stat"><div class="n" style="color:'+(chg>=0?"var(--good)":"var(--bad)")+'">'
      +(chg>=0?"+":"")+chg.toFixed(1)+'%</div><div class="l">over window</div></div>'
    +'<div class="stat"><div class="n">'+Math.max(...d.h).toFixed(2)+'</div><div class="l">high</div></div>'
    +'<div class="stat"><div class="n">'+Math.min(...d.l).toFixed(2)+'</div><div class="l">low</div></div>'
    +'<div class="stat"><div class="n">'+(d.v.reduce((a,b)=>a+b,0)/n).toFixed(1)+'M</div><div class="l">avg volume</div></div>';
}

/* ── arena (the console) ── */
const CON={order:[],seen:[]};
function shuffled(n,seed){const r=mulberry32(seed),a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function neffOf(idx){const k=idx.length;if(k<2)return k;let tr=0,fro=0;
  for(let i=0;i<k;i++)for(let j=0;j<k;j++){const v=DATA.corr[idx[i]][idx[j]];if(i===j)tr+=v;fro+=v*v;}
  return (tr*tr)/fro;}
function expectedBestNull(k){const ref=DATA.null_ref,K=Math.max(1,Math.round(k)),r=mulberry32(99);
  let acc=0;const T=600;
  for(let t=0;t<T;t++){let m=-Infinity;for(let i=0;i<K;i++)m=Math.max(m,ref[Math.floor(r()*ref.length)]);acc+=m;}
  return acc/T;}

RENDER.arena=(host)=>{
  host.appendChild(h(`<div>
    <p>Every evaluation below is a real one, replayed from
    <code>dev/prelim_harness.py</code>. The pool holds <b>${DATA.cands.filter(c=>c.kind==="real").length}
    genuine candidates</b> and <b>${DATA.cands.filter(c=>c.kind==="null").length} matched nulls</b> that
    carry no information by construction. Search as hard as you like. The best raw score always
    climbs, because searching always finds something. The platform counts how many
    <em>distinct</em> things you tried and prices that in.</p>
    <div class="stat-row" id="astats"></div>
    <p class="mut" id="allow" style="margin:10px 0 0"></p>
    <div class="btn-row">
      <button class="btn primary" id="b1">Evaluate one</button>
      <button class="btn" id="b10">Evaluate ten</button>
      <button class="btn" id="ball">Evaluate all</button>
      <button class="btn" id="bseal" disabled>Open the seal</button>
      <button class="btn" id="brst">Reset</button>
    </div>
    <div class="tablewrap" id="ledger"></div>
    <div id="verdict"></div>
    <p class="mut" style="margin-top:14px"><b>Margin over chance</b> is the best score found minus
    the best a run of matched nulls of the same effective size would reach. The allowance shown
    above is that correction, and it falls as the search widens, which is the discount working.
    On this data it stays small, because an uninformative candidate reliably costs something here
    rather than helping by luck. That is itself the reading: this space is safe to explore, and a
    noisier one would not be.</p>
    <p class="mut">The seal is two folds of data no selection in this pool was ever allowed to
    touch. In a live system it is the future, arriving on its own schedule.</p>
  </div>`));
  CON.order=shuffled(DATA.cands.length,20260811);
  document.getElementById("b1").onclick=()=>step(1);
  document.getElementById("b10").onclick=()=>step(10);
  document.getElementById("ball").onclick=()=>step(DATA.cands.length);
  document.getElementById("bseal").onclick=openSeal;
  document.getElementById("brst").onclick=()=>{CON.seen=[];renderArena();};
  renderArena();
};
function step(k){for(let i=0;i<k&&CON.seen.length<CON.order.length;i++)CON.seen.push(CON.order[CON.seen.length]);renderArena();}
function renderArena(){
  const seen=CON.seen,n=seen.length,eff=n?neffOf(seen):0;
  let best=null;seen.forEach(i=>{if(best===null||DATA.cands[i].dev>DATA.cands[best].dev)best=i;});
  const allow=n?-expectedBestNull(eff):0;
  document.getElementById("astats").innerHTML=
     '<div class="stat"><div class="n">'+n+'</div><div class="l">trials</div></div>'
    +'<div class="stat"><div class="n">'+(n?eff.toFixed(1):"0.0")+'</div><div class="l">effective</div></div>'
    +'<div class="stat"><div class="n">'+(best===null?"—":"+"+DATA.cands[best].dev.toFixed(5))+'</div><div class="l">best raw</div></div>'
    +'<div class="stat"><div class="n">'+(best===null?"—":"+"+(DATA.cands[best].dev+allow).toFixed(5))+'</div><div class="l">margin over chance</div></div>';
  document.getElementById("allow").textContent=n
    ? "Chance allowance at "+eff.toFixed(1)+" effective trials: "+allow.toFixed(5)
      +". It falls as you search, because a wider run of nulls reaches a better best, so less of your score is credited to you."
    : "The ledger is empty. Each evaluation is keyed so a retry costs nothing and a new hypothesis costs a trial.";
  const L=document.getElementById("ledger");
  L.innerHTML=!n
    ? '<div style="padding:24px;text-align:center;color:var(--faint);font-size:12.5px">no trials yet</div>'
    : '<table class="rt"><thead><tr><th>#</th><th>trial key</th><th>kind</th><th style="text-align:right">measured effect</th></tr></thead><tbody>'
      +seen.map((i,k)=>{const c=DATA.cands[i];
        return '<tr><td style="color:var(--faint)">'+String(k+1).padStart(2,"0")+'</td>'
          +'<td style="color:var(--muted)">t-'+(1000+i).toString(16)+'</td>'
          +'<td><span class="badge '+(c.kind==="real"?"good":"muted")+'">'+c.kind+'</span></td>'
          +'<td class="num" style="color:'+(c.dev>0?"var(--good)":"var(--faint)")+'">'
          +(c.dev>=0?"+":"−")+Math.abs(c.dev).toFixed(5)+'</td></tr>';}).reverse().join("")
      +'</tbody></table>';
  document.getElementById("bseal").disabled=n<2;
  if(n<2)document.getElementById("verdict").innerHTML="";
}
function openSeal(){
  const seen=CON.seen;let best=seen[0];
  seen.forEach(i=>{if(DATA.cands[i].dev>DATA.cands[best].dev)best=i;});
  const c=DATA.cands[best],eff=neffOf(seen);
  const mD=seen.reduce((a,i)=>a+DATA.cands[i].dev,0)/seen.length;
  const mS=seen.reduce((a,i)=>a+DATA.cands[i].sealed,0)/seen.length;
  const D=c.dev-mD,S=c.sealed-mS;
  document.getElementById("verdict").innerHTML=
    '<div class="warnbox" style="color:var(--text);border-color:var(--border2);background:var(--panel2)">'
    +'<b style="color:var(--accent)">Seal opened after '+seen.length+' trials.</b> The winner was a <b>'
    +c.kind+'</b> candidate. Against the average candidate in this draw it appeared to buy '
    +(D>=0?"+":"−")+Math.abs(D).toFixed(4)+' and it actually delivered '+(S>=0?"+":"−")+Math.abs(S).toFixed(4)
    +' on data no selection could reach, a retention of <b style="color:var(--accent)">'
    +(D!==0?(S/D).toFixed(2):"—")+'</b>. Effective trials '+eff.toFixed(1)+' against '+seen.length+' nominal.</div>';
}

      <svg id="fig4" viewBox="0 0 760 150"></svg></div>
    <p class="mut" id="cap4"></p>
  </div>`));
  const sl=document.getElementById("nSlider");
  sl.addEventListener("input",()=>{document.getElementById("nOut").textContent=sl.value;drawFig1(+sl.value);});
  drawFig1(1);drawFig2();drawFig3();drawFig4();
};

/* ── locked ── */
RENDER._locked=(host,v)=>{
  host.appendChild(h(`<div>
    <p>${v.what||""}</p>
    <div class="lockbox" style="text-align:left"><div class="big">🔒</div>
      <div style="font-size:14px;color:var(--text);margin-bottom:6px">Not served in this deployment</div>
      <p class="mut" style="margin:0;max-width:72ch">${v.why||""}</p>
      <p class="mut" style="margin:9px 0 0;max-width:72ch">Faking it would be easy and would prove
      nothing, so it is locked instead. Everything above the divider in the sidebar runs on real
      data and is open.</p></div></div>`));
};

/* ─── charts ──────────────────────────────────────────────────────────── */
const NOISE=(()=>{const r=mulberry32(20260731),o=[];
  for(let i=0;i<400;i++){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();
    o.push(Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v));}return o;})();

function drawFig1(n){
  const svg=document.getElementById("fig1");if(!svg)return;clear(svg);
  const L=48,R=18,T=18,B=34,W=760,H=280,w=W-L-R,hh=H-T-B;
  const yMin=-3.6,yMax=3.6;
  const X=i=>L+(n===1?w/2:(i/(n-1))*w), Y=v=>T+hh-((v-yMin)/(yMax-yMin))*hh;
  for(const v of [-3,-2,-1,0,1,2,3]){
    el("line",{x1:L,y1:Y(v),x2:L+w,y2:Y(v),stroke:cssv("--border"),"stroke-width":v===0?1:.5,
      "stroke-dasharray":v===0?"none":"2 4"},svg);
    stext(svg,L-7,Y(v)+4,v>0?"+"+v:String(v),{anchor:"end",size:10.5});}
  const d=NOISE.slice(0,n),best=Math.max(...d),bi=d.indexOf(best);
  d.forEach((v,i)=>el("circle",{cx:X(i),cy:Y(v),r:i===bi?4.5:2.3,
    fill:i===bi?cssv("--accent"):cssv("--faint"),opacity:i===bi?1:.7},svg));
  el("line",{x1:L,y1:Y(best),x2:L+w,y2:Y(best),stroke:cssv("--accent"),"stroke-width":2},svg);
  stext(svg,L+w,Y(best)-8,"best of "+n+" = "+best.toFixed(2),
    {anchor:"end",fill:cssv("--accent"),size:12,weight:600});
  const e=Math.sqrt(2*Math.log(Math.max(n,1.001)));
  el("line",{x1:L,y1:Y(e),x2:L+w,y2:Y(e),stroke:cssv("--muted"),"stroke-width":1,"stroke-dasharray":"5 4"},svg);
  stext(svg,L+4,Y(e)-6,"expected best ≈ √(2 ln N)",{size:10.5});
  stext(svg,L,H-10,"each dot is one idea with zero real skill",{size:11});
}
function drawFig2(){
  const svg=document.getElementById("fig2");if(!svg)return;clear(svg);
  const L=58,R=22,W=760,w=W-L-R,T1=14,H1=162,T2=214,H2=72;
  const c=DATA.curve,n0=c[0].n,nN=c[c.length-1].n,X=n=>L+((n-n0)/(nN-n0))*w;
  const hi=Math.max(...c.flatMap(p=>[p.D,p.S]))*1.08,Y=v=>T1+H1-(v/hi)*H1;
  for(let i=0;i<=4;i++){const v=(i/4)*hi;
    el("line",{x1:L,y1:Y(v),x2:L+w,y2:Y(v),stroke:cssv("--border"),"stroke-width":.5},svg);
    stext(svg,L-7,Y(v)+4,v.toFixed(3),{anchor:"end",size:10});}
  const line=(k,col)=>el("path",{d:c.map((p,i)=>(i?"L":"M")+X(p.n).toFixed(1)+" "+Y(p[k]).toFixed(1)).join(" "),
    fill:"none",stroke:col,"stroke-width":2.2,"stroke-linejoin":"round"},svg);
  line("S",cssv("--good"));line("D",cssv("--accent"));
  const last=c[c.length-1];
  stext(svg,X(last.n)-4,Y(last.D)+15,"what searching appears to buy",{anchor:"end",size:11,fill:cssv("--accent"),weight:600});
  stext(svg,X(last.n)-4,Y(last.S)-7,"what survived the seal",{anchor:"end",size:11,fill:cssv("--good"),weight:600});
  const rv=c.map(p=>p.retention),rlo=Math.min(1,...rv)-.03,rhi=Math.max(...rv)+.03;
  const RY=v=>T2+H2-((v-rlo)/(rhi-rlo))*H2;
  el("line",{x1:L,y1:RY(1),x2:L+w,y2:RY(1),stroke:cssv("--border2"),"stroke-width":1.2,"stroke-dasharray":"4 4"},svg);
  stext(svg,L-7,RY(1)+4,"1.00",{anchor:"end",size:10});
  el("path",{d:c.map((p,i)=>(i?"L":"M")+X(p.n).toFixed(1)+" "+RY(p.retention).toFixed(1)).join(" "),
    fill:"none",stroke:cssv("--accent2"),"stroke-width":2.2},svg);
  stext(svg,X(c[0].n)+6,RY(c[0].retention)-7,c[0].retention.toFixed(2),{size:11,fill:cssv("--accent2"),weight:600});
  stext(svg,X(last.n)-4,RY(last.retention)-9,last.retention.toFixed(2),{anchor:"end",size:11,fill:cssv("--accent2"),weight:600});
  stext(svg,L-52,T2-4,"retained",{size:10.5});
  for(const n of [2,8,16,24,32,48,64].filter(t=>t<=nN))stext(svg,X(n),312,String(n),{anchor:"middle",size:10.5});
  stext(svg,L+w/2,328,"candidates searched",{anchor:"middle",size:11});
  const g=document.getElementById("gap2");
  if(g)g.innerHTML="Both curves are measured inside their own fold set against the average candidate "
    +"in the same draw, so the longer training window the sealed folds enjoy cancels out. Searching "
    +last.n+" candidates appeared to buy "+last.D.toFixed(4)+" and "+last.S.toFixed(4)
    +" actually survived, a retention of <b style='color:var(--accent)'>"+last.retention.toFixed(2)
    +"</b>. The signal is the decline: retention falls monotonically from "+c[0].retention.toFixed(2)
    +" as the search widens. That decay is the selection cost, measured rather than assumed.";
}
function drawFig3(){
  const svg=document.getElementById("fig3");if(!svg)return;clear(svg);
  const L=26,R=22,T=30,B=46,W=760,H=240,w=W-L-R,hh=H-T-B;
  const nulls=DATA.nulls,reals=DATA.reals,thr=DATA.gate_threshold;
  const all=nulls.concat(reals,[thr]),lo=Math.min(...all),hi=Math.max(...all),pad=(hi-lo)*.08;
  const X=v=>L+((v-(lo-pad))/((hi+pad)-(lo-pad)))*w;
  const yN=T+hh*.3,yR=T+hh*.72;
  [yN,yR].forEach(y=>el("line",{x1:L,y1:y,x2:L+w,y2:y,stroke:cssv("--border"),"stroke-width":1},svg));
  el("line",{x1:X(thr),y1:T-6,x2:X(thr),y2:T+hh+6,stroke:cssv("--accent"),"stroke-width":1.6,"stroke-dasharray":"5 4"},svg);
  stext(svg,X(thr),T-12,"acceptance threshold",{anchor:"middle",size:11,fill:cssv("--accent")});
  nulls.forEach(v=>el("circle",{cx:X(v),cy:yN,r:3.3,fill:cssv("--faint"),opacity:.85},svg));
  reals.forEach(v=>el("circle",{cx:X(v),cy:yR,r:3.7,fill:v>=thr?cssv("--good"):cssv("--faint"),opacity:v>=thr?.95:.5},svg));
  stext(svg,L,yN-13,nulls.length+" matched nulls — none admitted",{size:12,fill:cssv("--muted"),weight:600});
  stext(svg,L,yR-13,reals.length+" real candidates — "+DATA.n_real_accepted+" admitted",{size:12,fill:cssv("--good"),weight:600});
  stext(svg,L+w/2,H-8,"development-fold gain (right is better)",{anchor:"middle",size:11});
  const c=document.getElementById("cap3");
  if(c)c.textContent="Every null lands on the wrong side of zero, because adding an uninformative column "
    +"costs parameters and buys nothing. The best of them falls short of the threshold by "
    +Math.abs(DATA.best_null_shortfall).toFixed(4)+", which is what lets the gate quote a measured "
    +"false-positive rate instead of an assumed one.";
}
function drawFig4(){
  const svg=document.getElementById("fig4");if(!svg)return;clear(svg);
  const L=150,R=140,T=16,W=760,w=W-L-R,maxN=DATA.n_pool,X=v=>L+(v/maxN)*w;
  const bar=(y,val,col,lab,sub,faint)=>{
    el("rect",{x:L,y,width:Math.max(X(val)-L,1),height:20,rx:3,fill:col,opacity:faint?.32:.92},svg);
    stext(svg,L-10,y+14,lab,{anchor:"end",size:11.5,fill:cssv("--text"),weight:600});
    stext(svg,X(val)+9,y+14,sub,{size:11.5,fill:col,weight:600});};
  bar(T,DATA.n_nominal,cssv("--faint"),"24 real, nominal",DATA.n_nominal+" tries",1);
  bar(T+28,DATA.n_eff,cssv("--accent"),"24 real, effective",DATA.n_eff.toFixed(1)+"  ("+Math.round(100*DATA.n_eff/DATA.n_nominal)+"%)");
  bar(T+66,DATA.n_pool,cssv("--faint"),"+40 junk, nominal",DATA.n_pool+" tries",1);
  bar(T+94,DATA.n_eff_pool,cssv("--accent2"),"+40 junk, effective",DATA.n_eff_pool.toFixed(1)+"  ("+Math.round(100*DATA.n_eff_pool/DATA.n_pool)+"%)");
  const c=document.getElementById("cap4");
  if(c)c.innerHTML="Participation ratio of the eigenvalues of the correlation matrix of per-observation "
    +"improvements. Among the 24 real candidates the median pairwise correlation is "+DATA.corr_median.toFixed(2)
    +" and the maximum "+DATA.corr_max.toFixed(2)+", so counting attempts over-penalises by "
    +(DATA.n_nominal/DATA.n_eff).toFixed(1)+"×. But padding the pool with forty worthless candidates "
    +"<b style='color:var(--accent)'>raises</b> the effective share from "+Math.round(100*DATA.n_eff/DATA.n_nominal)
    +"% to "+Math.round(100*DATA.n_eff_pool/DATA.n_pool)+"%, because junk is mutually independent junk and each "
    +"null contributes a fresh direction. Independence is not informativeness, so discounting by effective "
    +"trials alone lets a wasteful search off too lightly. That is an open problem, not a solved detail.";
}
